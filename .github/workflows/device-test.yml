name: Device test (emulator)
on:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_BUILD: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Release build for the emulator (same R8 settings, x86_64)
        run: |
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'PROPS'
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          reactNativeArchitectures=x86_64
          PROPS
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Fail unless the SMS module was linked
        run: |
          f=$(find node_modules/expo/android/build -name ExpoModulesPackageList.kt | head -1)
          echo "$f"
          grep -n "smsreader" "$f"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens-and-logs
          path: e2e/
      - name: Fail if any step failed
        run: "! grep -q '^FAIL' e2e/result.txt"
