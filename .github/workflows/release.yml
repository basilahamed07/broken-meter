name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create the release under (e.g. v0.1.0)
        required: true
        default: v0.1.0
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_BUILD: '1' # drops the INTERNET permission: the shipped APK cannot use the network
      EXPO_NO_TELEMETRY: '1'
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Shrink the APK (R8, resource shrinking, arm only)
        run: |
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'PROPS'
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          PROPS
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check APK size (< 40 MB) and name it
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $((SIZE/1024/1024)) MB"
          [ "$SIZE" -lt 41943040 ] || { echo "APK is larger than 40 MB"; exit 1; }
          cp "$APK" "BrokeMeter-${TAG}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: BrokeMeter-*.apk
          generate_release_notes: true
